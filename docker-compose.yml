services:
  mcp:
    image: data-mcp-server:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - MCP_ALLOWED_HOSTS=47.103.38.58
      - MCP_API_TOKEN=${MCP_API_TOKEN}
    expose:
      - "3000"
    networks:
      - mcp-internal

  nginx:
    image: nginx:1.27.5
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    ports:
      - "3000:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - mcp
    networks:
      - mcp-public
      - mcp-internal

networks:
  mcp-internal:
    internal: true
  mcp-public:
    driver: bridge